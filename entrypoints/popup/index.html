<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Whisper Reader</title>
    <style>
      /*
       * Same three-state theming as the in-page panel: tokens on :root for
       * light, redefined under the media query (guarded so an explicit light
       * choice still wins) and again under an explicit [data-theme="dark"].
       */
      :root {
        --fg: #1b1b1f;
        --bg: #fcfbf9;
        --btn-bg: rgba(0, 0, 0, 0.06);
        --btn-border: rgba(0, 0, 0, 0.12);
        --btn-hover: rgba(0, 0, 0, 0.11);
        --accent: #f0a500;
        --accent-hover: #ffb61a;
        --accent-border: #d89400;
        --accent-ink: #21160a;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --fg: #ececf1;
          --bg: #1c1c20;
          --btn-bg: rgba(255, 255, 255, 0.08);
          --btn-border: rgba(255, 255, 255, 0.16);
          --btn-hover: rgba(255, 255, 255, 0.14);
          color-scheme: dark;
        }
      }
      :root[data-theme='dark'] {
        --fg: #ececf1;
        --bg: #1c1c20;
        --btn-bg: rgba(255, 255, 255, 0.08);
        --btn-border: rgba(255, 255, 255, 0.16);
        --btn-hover: rgba(255, 255, 255, 0.14);
        color-scheme: dark;
      }

      body {
        width: 260px;
        margin: 0;
        padding: 14px;
        font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, 'Segoe UI',
          sans-serif;
        color: var(--fg);
        background: var(--bg);
      }
      button {
        font: inherit;
        color: inherit;
        background: var(--btn-bg);
        border: 1px solid var(--btn-border);
        border-radius: 8px;
        padding: 7px 10px;
        cursor: pointer;
      }
      button:hover {
        background: var(--btn-hover);
      }
      .primary {
        width: 100%;
        background: var(--accent);
        border-color: var(--accent-border);
        color: var(--accent-ink);
        font-weight: 600;
        padding: 9px 10px;
      }
      .primary:hover {
        background: var(--accent-hover);
      }
      .row {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }
      .row button {
        flex: 1;
      }
      .note {
        margin: 10px 0 0;
        font-size: 11.5px;
        opacity: 0.62;
      }
      .link {
        margin-top: 10px;
        padding: 0;
        border: none;
        background: none;
        font-size: 11.5px;
        opacity: 0.62;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .link:hover {
        background: none;
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
