<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Whisper Reader demo</title>
<!--
  The demo video's stage. video.mjs loads a timeline into scene.load(), then
  calls scene.render(t) once per frame and screenshots the result. Nothing
  here runs on a clock: every frame is a pure function of t, so the video is
  reproducible and the highlight lands on each word exactly when the
  narration says it. The page and player inside the frame are the real ones.
-->
<link rel="stylesheet" href="media.css">
<style>
  #root { width: 1280px; height: 720px; }
  .caption {
    position: absolute; left: 0; right: 0; top: 648px;
    display: flex; justify-content: center;
    transition: none;
  }
  .card-full {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
    background:
      radial-gradient(900px 500px at 50% 0%, rgba(240, 165, 0, 0.2), transparent 65%),
      linear-gradient(165deg, var(--paper), var(--paper-2));
    z-index: 60;
  }
  .card-full .big { font-size: 64px; font-weight: 700; letter-spacing: -0.03em; margin: 22px 0 8px; }
  .card-full .tag { font-size: 24px; color: var(--muted); margin: 0; }
  .keys-card {
    position: absolute; left: 50%; top: 50%;
    width: 760px; transform: translate(-50%, -50%);
    background: rgba(255, 253, 248, 0.97);
    border: 1px solid rgba(60, 40, 10, 0.12);
    border-radius: 22px;
    padding: 34px 40px;
    box-shadow: 0 40px 100px -30px rgba(40, 25, 5, 0.55);
    z-index: 55;
  }
  .keys-card h2 { margin: 0 0 22px; font-size: 28px; letter-spacing: -0.02em; }
  .krow { display: grid; grid-template-columns: 290px 1fr; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .krow:first-of-type { border-top: 0; }
  .krow .what { font-size: 19px; font-weight: 560; }
  .scrim { position: absolute; inset: 0; background: rgba(30, 22, 8, 0.32); z-index: 54; }
</style>
</head>
<body>
<div id="root" class="canvas">
  <div class="window" id="win" style="left:40px;top:24px;width:1200px;height:610px">
    <div class="bar"><span class="dots"><i></i><i></i><i></i></span>
      <span class="url">harbourlight.example/essays/the-case-for-reading-slowly</span>
      <span class="ext-button" id="ext"></span></div>
    <div class="viewport" id="viewport" style="height:570px">
      <iframe id="page" src="/scripts/media/article.html"></iframe>
    </div>
  </div>
  <div class="caption" id="caption"><span class="chip"><span class="dot"></span><span id="caption-text"></span></span></div>
  <div class="scrim" id="scrim"></div>
  <div class="keys-card" id="keys"></div>
  <svg class="cursor" id="cursor" viewBox="0 0 26 34"><path d="M3 3 L3 27 L9.5 21 L14 31 L18 29 L13.6 19.4 L22 19.4 Z" fill="#fff" stroke="#1d1b17" stroke-width="2" stroke-linejoin="round"/></svg>
  <div id="ripples"></div>
  <div class="card-full" id="title-card"></div>
  <div class="card-full" id="end-card"></div>
</div>
<script>
const ICON = `<svg viewBox="0 0 128 128"><circle cx="64" cy="64" r="60" fill="#f0a500"/><rect x="38" y="46" width="12" height="36" rx="2" fill="#21160a"/><rect x="58" y="30" width="12" height="68" rx="2" fill="#21160a"/><rect x="78" y="40" width="12" height="48" rx="2" fill="#21160a"/></svg>`;
const INNER_W = 1440;
const SCALE = 1200 / INNER_W;
const $ = (id) => document.getElementById(id);

$('ext').innerHTML = ICON;
const frame = $('page');
Object.assign(frame.style, {
  width: INNER_W + 'px',
  height: Math.ceil(570 / SCALE) + 'px',
  transform: `scale(${SCALE})`,
});

$('title-card').innerHTML = `${ICON.replace('<svg', '<svg width="96" height="96"')}
  <p class="big">Whisper Reader</p><p class="tag">Listen to any page. Follow every word.</p>`;
$('end-card').innerHTML = `${ICON.replace('<svg', '<svg width="76" height="76"')}
  <p class="big" style="font-size:54px">Whisper Reader</p>
  <p class="tag">Free &nbsp;·&nbsp; No account &nbsp;·&nbsp; Nothing leaves your device</p>
  <p class="tag" style="font-size:18px;margin-top:22px">For Chrome and Firefox</p>`;
const combo = (...keys) => keys.map((k, i) => (i ? '<span class="plus">+</span>' : '') + `<span class="key${i === keys.length - 1 ? ' amber' : ''}">${k}</span>`).join('');
$('keys').innerHTML = `<h2>Shortcuts for everything</h2>
  <div class="krow"><div class="combo" style="display:flex;align-items:center">${combo('Alt', 'Shift', 'P')}</div><div class="what">Play or pause from anywhere</div></div>
  <div class="krow"><div class="combo" style="display:flex;align-items:center">${combo('Alt', 'Shift', 'S')}</div><div class="what">Read the text you selected</div></div>
  <div class="krow"><div style="display:flex;align-items:center;gap:8px"><span style="color:var(--muted);font-size:15px">hold</span><span class="key amber">F</span></div><div class="what">Skim at 2× while held</div></div>
  <div class="krow"><div style="display:flex;align-items:center;gap:8px"><span class="key">←</span><span class="key">→</span></div><div class="what">Previous / next sentence</div></div>`;

let stage = null;
let timeline = null;
let applied = {};
let sentences = [];
let scrollTargets = [];

const ease = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x));
const fade = (t, from, to, edge = 0.35) =>
  t < from || t > to ? 0 : Math.min(1, (t - from) / edge, (to - t) / edge);

async function waitFor(fn, timeout = 15000) {
  const end = Date.now() + timeout;
  for (;;) {
    let v = null;
    try { v = fn(); } catch { v = null; }
    if (v) return v;
    if (Date.now() > end) throw new Error('timeout');
    await new Promise((r) => setTimeout(r, 40));
  }
}

/** Page (iframe) coordinates to stage coordinates. */
function toStage(x, y) {
  const vp = $('viewport').getBoundingClientRect();
  return [vp.left + x * SCALE, vp.top + y * SCALE];
}

function panelEl(selector) {
  return stage.panelRoot()?.querySelector(selector) ?? null;
}

function centerOf(el) {
  const r = el.getBoundingClientRect();
  return toStage(r.left + r.width / 2, r.top + r.height / 2);
}

/** Where a cursor target is right now. Resolved per frame, because the
 *  panel moves when it expands. */
function resolve(target) {
  if (Array.isArray(target)) return target;
  const [kind, a, b] = target.split(':');
  if (kind === 'word') {
    const r = stage.wordRect(Number(a), Number(b));
    return r ? toStage(r.left + r.width * 0.45, r.top + r.height * 0.62) : [900, 400];
  }
  if (kind === 'button') {
    // 'Expand|Compact': a button whose label changes when it is pressed.
    const labels = a.split('|');
    const el = [...stage.panelRoot().querySelectorAll('button')].find(
      (x) => labels.includes(x.getAttribute('aria-label')) || labels.includes(x.textContent.trim()),
    );
    return el ? centerOf(el) : [1100, 600];
  }
  if (kind === 'slider') {
    const el = panelEl('#calm-rate');
    if (!el) return [1100, 500];
    const r = el.getBoundingClientRect();
    const max = Number(el.max) || 1;
    const thumb = 8;
    const x = r.left + thumb + (Number(a) / max) * (r.width - thumb * 2);
    return toStage(x, r.top + r.height / 2);
  }
  if (kind === 'select') {
    const el = panelEl('#calm-voice');
    if (!el) return [1100, 300];
    const r = el.getBoundingClientRect();
    return toStage(r.left + r.width * 0.72, r.top + r.height / 2);
  }
  return [1320, 760];
}

function cursorAt(t) {
  const keys = timeline.cursor;
  if (t <= keys[0].t) return resolve(keys[0].target);
  for (let i = 1; i < keys.length; i++) {
    if (t <= keys[i].t) {
      const p = keys[i - 1], q = keys[i];
      // Hold still until the move starts, then glide.
      const start = q.t - (q.travel ?? 0.7);
      const k = ease((t - Math.max(p.t, start)) / Math.max(0.001, q.t - Math.max(p.t, start)));
      const [x0, y0] = resolve(p.target);
      const [x1, y1] = resolve(q.target);
      return t < start ? [x0, y0] : [x0 + (x1 - x0) * k, y0 + (y1 - y0) * k];
    }
  }
  return resolve(keys[keys.length - 1].target);
}

function scrollAt(t) {
  let from = 0, to = 0, at = 0;
  for (const s of scrollTargets) {
    if (s.t <= t) { from = to; to = s.y; at = s.t; }
  }
  return from + (to - from) * ease((t - at) / 0.8);
}

const charsPerSecondAt1x = 16.5;

function apply(key, value, fn) {
  if (applied[key] === value) return;
  applied[key] = value;
  fn(value);
}

window.scene = {
  /** Bring up the real components; returns the sentences as the collector
   *  produced them, which is what the narration must speak. */
  async load() {
    await waitFor(() => frame.contentWindow?.__stage);
    stage = frame.contentWindow.__stage;
    await stage.init({
      geometry: { x: -1, y: -1, width: 380, height: 470, mode: 'compact' },
      theme: 'light',
      rate: 0.79,
      preset: 'calm',
      voiceId: 'Microsoft Zira - English (United States)',
    });
    stage.setVoice('Zira');
    sentences = stage.sentences();
    return { sentences, ladder: stage.ladder() };
  },

  setTimeline(data) {
    timeline = data;
    applied = {};
    // Scroll so a sentence that would fall below the fold sits a third of
    // the way down instead -- the same thing autoscroll does.
    const viewH = 570 / SCALE;
    let y = 0;
    scrollTargets = [];
    for (const seg of data.segments) {
      const top = stage.sentenceTop(seg.sentence);
      if (top - y > viewH * 0.62 || top < y) {
        y = Math.max(0, top - viewH * 0.3);
        scrollTargets.push({ t: seg.start - 0.25, y });
      }
    }
    return true;
  },

  render(t) {
    const tl = timeline;
    const ev = tl.events;

    // Cards
    $('title-card').style.opacity = t < ev.titleEnd - 0.4 ? 1 : Math.max(0, (ev.titleEnd - t) / 0.4);
    $('title-card').style.display = t < ev.titleEnd ? 'flex' : 'none';
    const endK = Math.min(1, Math.max(0, (t - ev.endStart) / 0.5));
    $('end-card').style.opacity = endK;
    $('end-card').style.display = endK > 0 ? 'flex' : 'none';
    const keysK = fade(t, ev.keysStart, ev.keysEnd, 0.3);
    $('keys').style.opacity = keysK;
    $('keys').style.transform = `translate(-50%, ${-50 + (1 - keysK) * 3}%)`;
    $('scrim').style.opacity = keysK;

    // Reading position
    let active = null;
    for (const seg of tl.segments) if (seg.start <= t) active = seg;
    if (!active) {
      stage.clear();
    } else {
      const s = sentences[active.sentence];
      const ms = (t - active.start) * 1000;
      let pos = 0;
      for (const w of active.words) if (w.ms <= ms) pos = w.pos;
      let word = 0;
      s.words.forEach((w, i) => { if (w.start <= pos) word = i; });
      apply('show', active.sentence + ':' + word, () => stage.show(active.sentence, word));
    }

    // Panel
    apply('mode', t >= ev.expand ? 'full' : 'compact', (mode) => {
      if (applied.modeInit !== undefined) stage.toggleMode();
      applied.modeInit = mode;
    });
    apply('theme', t >= ev.theme ? 'dark' : 'light', (v) => stage.setTheme(v));
    apply('voice', t >= ev.voice ? 'David' : 'Zira', (v) => stage.setVoice(v));

    // Moving the slider makes it a custom setting, exactly as reader.ts does.
    apply('preset', t >= ev.dragEnd ? 'custom' : 'calm', (v) => stage.setPreset(v));
    let rate = ev.rateFrom;
    if (t >= ev.dragStart) {
      const k = ease((t - ev.dragStart) / (ev.dragEnd - ev.dragStart));
      const ladder = tl.ladder;
      const i0 = ladder.indexOf(ev.rateFrom), i1 = ladder.indexOf(ev.rateTo);
      rate = ladder[Math.round(i0 + (i1 - i0) * k)];
    }
    apply('rate', rate, (r) => stage.setRate(r));

    const reading = active && t < ev.stopReading;
    const remainingChars = active
      ? sentences.slice(active.sentence).reduce((n, s) => n + s.text.length, 0)
      : sentences.reduce((n, s) => n + s.text.length, 0);
    const remainingMs = Math.round((remainingChars / (charsPerSecondAt1x * rate)) * 1000 / 15000) * 15000;
    apply('state', [reading ? 'speaking' : active ? 'paused' : 'idle', active?.sentence ?? 0, remainingMs, rate].join('|'), () =>
      stage.setState({
        status: reading ? 'speaking' : active ? 'paused' : 'idle',
        sentenceIndex: active?.sentence ?? 0,
        remainingMs,
        rate,
        effectiveRate: rate,
      }));

    frame.contentWindow.scrollTo(0, Math.round(scrollAt(t)));

    // Caption
    let caption = null, k = 0;
    for (const c of tl.captions) {
      const v = fade(t, c.from, c.to, 0.3);
      if (v > 0) { caption = c.text; k = v; }
    }
    if (caption) $('caption-text').textContent = caption;
    $('caption').style.opacity = k;
    $('caption').style.transform = `translateY(${(1 - k) * 8}px)`;

    // Cursor and clicks
    const [cx, cy] = cursorAt(t);
    const cursor = $('cursor');
    let pressed = false;
    const ripples = [];
    for (const c of tl.clicks) {
      if (t >= c.t && t < c.t + 0.12) pressed = true;
      if (t >= c.t && t < c.t + 0.5) ripples.push({ k: (t - c.t) / 0.5, at: c });
    }
    cursor.style.left = cx - 3 + 'px';
    cursor.style.top = cy - 3 + 'px';
    cursor.style.transform = pressed ? 'scale(0.86)' : 'none';
    cursor.style.opacity = t < ev.titleEnd || t > ev.keysStart - 0.2 ? 0 : 1;
    $('ripples').innerHTML = ripples
      .map(({ k }) => `<div class="ripple" style="left:${cx}px;top:${cy}px;transform:scale(${0.4 + k * 0.9});opacity:${1 - k}"></div>`)
      .join('');
    return true;
  },
};
</script>
</body>
</html>
