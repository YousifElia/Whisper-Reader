<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Whisper Reader media</title>
<!--
  Store slides. Open as compose.html?slide=<name>; capture.mjs does this for
  every slide and saves exact-size PNGs. Everything inside the browser frames
  is live: the real article page, the real panel and highlighter (through
  stage.js), and the real setup page from the built extension.
-->
<link rel="stylesheet" href="media.css">
<style>
  .center { position: absolute; left: 0; right: 0; text-align: center; }
  .label-row { position: absolute; display: flex; align-items: center; gap: 10px; }
  .float-panel {
    position: absolute;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 40px 90px -24px rgba(60, 40, 10, 0.45), 0 14px 34px -14px rgba(60, 40, 10, 0.3);
  }
  .float-panel iframe { border: 0; position: absolute; transform-origin: 0 0; }

  /* shortcuts */
  .group-title {
    font: 650 13px/1 var(--font);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--amber-deep);
    margin: 0 0 18px;
  }
  .global-row {
    display: grid;
    grid-template-columns: 300px 1fr;
    align-items: center;
    padding: 14px 0;
    border-top: 1px solid var(--line);
  }
  .global-row:first-of-type { border-top: 0; }
  .combo { display: flex; align-items: center; }
  .global-row .what { font-size: 21px; font-weight: 600; letter-spacing: -0.01em; }
  .global-row .what small { display: block; font-size: 15px; font-weight: 400; color: var(--muted); margin-top: 3px; }
  .page-keys {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px 30px;
  }
  .page-key { display: flex; align-items: center; gap: 14px; }
  .page-key .keys { display: flex; align-items: center; gap: 6px; flex: none; width: 196px; }
  .page-key .keys .or { color: var(--muted); font-size: 13px; margin: 0 2px; }
  .page-key .what { font-size: 16.5px; font-weight: 560; }
  .card {
    position: absolute;
    background: rgba(255, 255, 255, 0.72);
    border: 1px solid rgba(60, 40, 10, 0.1);
    border-radius: 18px;
    padding: 28px 32px;
    box-shadow: 0 24px 60px -30px rgba(60, 40, 10, 0.35);
  }
  .mouse-tips { display: flex; gap: 26px; font-size: 15.5px; color: var(--muted); }
  .mouse-tips b { color: var(--ink); font-weight: 600; }

  /* promo */
  .promo-title { font-size: 34px; font-weight: 700; letter-spacing: -0.025em; margin: 0; }
  .demo-line {
    font: 17px/1.6 Georgia, serif;
    color: #3a352d;
  }
  .demo-line .s { background: rgba(255, 206, 92, 0.32); border-radius: 3px; }
  .demo-line .w { background: rgba(255, 176, 32, 0.7); border-radius: 3px; }
</style>
</head>
<body>
<div id="root" class="canvas"></div>
<script type="module">
const ICON = `<svg viewBox="0 0 128 128" aria-hidden="true">
  <circle cx="64" cy="64" r="60" fill="#f0a500"/>
  <rect x="38" y="46" width="12" height="36" rx="2" fill="#21160a"/>
  <rect x="58" y="30" width="12" height="68" rx="2" fill="#21160a"/>
  <rect x="78" y="40" width="12" height="48" rx="2" fill="#21160a"/>
</svg>`;

const ARTICLE = '/scripts/media/article.html';
const WELCOME = '/ext/welcome.html';
const ARTICLE_URL = 'harbourlight.example/essays/the-case-for-reading-slowly';

const SIZES = {
  hero: [1280, 800], speed: [1280, 800], voices: [1280, 800],
  shortcuts: [1280, 800], themes: [1280, 800], select: [1280, 800],
  setup: [1280, 800], 'promo-small': [440, 280], 'promo-marquee': [1400, 560],
  social: [1280, 640],
};

const root = document.getElementById('root');
const slide = new URLSearchParams(location.search).get('slide') ?? 'hero';
const [W, H] = SIZES[slide] ?? [1280, 800];
Object.assign(root.style, { width: W + 'px', height: H + 'px' });

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function waitFor(fn, timeout = 15000) {
  const end = Date.now() + timeout;
  for (;;) {
    let value = null;
    try { value = fn(); } catch { value = null; }
    if (value) return value;
    if (Date.now() > end) throw new Error('timed out waiting for ' + fn);
    await sleep(40);
  }
}

function html(markup, style = {}) {
  const wrap = document.createElement('div');
  wrap.innerHTML = markup.trim();
  const node = wrap.firstElementChild;
  Object.assign(node.style, style);
  root.appendChild(node);
  return node;
}

/** A generic browser window with a live page scaled inside it. */
function browserWindow({ x, y, w, h, url, dark = false, src, inner, scale }) {
  const win = html(
    `<div class="window${dark ? ' dark' : ''}">
       <div class="bar"><span class="dots"><i></i><i></i><i></i></span>
         <span class="url">${url}</span><span class="ext-button">${ICON}</span></div>
       <div class="viewport"></div>
     </div>`,
    { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' },
  );
  const viewport = win.querySelector('.viewport');
  viewport.style.height = h - 40 + 'px';
  const innerH = inner[1] ?? Math.ceil((h - 40) / scale);
  const frame = document.createElement('iframe');
  Object.assign(frame.style, {
    width: inner[0] + 'px',
    height: innerH + 'px',
    transform: `scale(${scale})`,
  });
  const loaded = new Promise((r) => frame.addEventListener('load', () => r(frame), { once: true }));
  frame.src = src;
  viewport.appendChild(frame);
  return { win, frame, loaded, innerW: inner[0], innerH };
}

/** Bring up the real reader components inside a framed article. */
async function stageIn(frame, options) {
  const stage = await waitFor(() => frame.contentWindow.__stage);
  await stage.init(options);
  return stage;
}

function sentenceIndex(stage, startsWith) {
  const i = stage.sentences().findIndex((s) => s.text.startsWith(startsWith));
  if (i < 0) throw new Error('no sentence starting ' + startsWith);
  return i;
}
function wordIndex(stage, sentence, word) {
  const s = stage.sentences()[sentence];
  const i = s.words.findIndex((w) => s.text.slice(w.start, w.end) === word);
  if (i < 0) throw new Error('no word ' + word);
  return i;
}

/** Highlight a sentence and word, report "speaking", and scroll the page so
 *  the sentence sits `fromTop` css px below the top of the frame. */
function reading(frame, stage, { sentence, word, fromTop = 200, anchor, remainingMs = 4 * 60_000 }) {
  const i = sentenceIndex(stage, sentence);
  const w = word ? wordIndex(stage, i, word) : null;
  // Scroll to a heading when given one, so the frame never opens on a
  // half-cut line of text.
  const top = anchor
    ? stage.sentenceTop(sentenceIndex(stage, anchor)) - 26
    : stage.sentenceTop(i) - fromTop;
  frame.contentWindow.scrollTo(0, Math.max(0, top));
  stage.show(i, w);
  stage.setState({ status: 'speaking', sentenceIndex: i, remainingMs });
  return i;
}

const panelFull = (innerW, { width = 360, height = 560, top = 24, right = 28 } = {}) => ({
  x: innerW - width - right, y: top, width, height, mode: 'full',
});
const panelCompact = (innerW, innerH, { width = 360, right = 28, bottom = 28 } = {}) => ({
  x: innerW - width - right, y: innerH - 60 - bottom, width, height: 560, mode: 'compact',
});

async function welcomeAt(frame, step, pick) {
  const doc = await waitFor(() => frame.contentDocument?.querySelector('#step h2') && frame.contentDocument);
  if (pick) {
    const card = [...doc.querySelectorAll('.choice')].find((c) => c.textContent.includes(pick));
    card?.click();
  }
  for (let i = 1; i < step; i++) {
    doc.querySelector('.actions .primary').click();
    await sleep(60);
  }
  return doc;
}

const SLIDES = {
  async hero() {
    html(`<div class="center" style="top:54px">
      <h1 class="headline">Listen to any page. <span class="accent">Follow every word.</span></h1>
      <p class="sub">Whisper Reader reads web pages aloud and highlights each word as it is spoken.</p></div>`);
    const s = 1160 / 1440;
    const w = browserWindow({ x: 60, y: 196, w: 1160, h: 650, url: ARTICLE_URL, src: ARTICLE, inner: [1440], scale: s });
    await w.loaded;
    const stage = await stageIn(w.frame, { geometry: panelFull(1440, { height: 470 }), theme: 'light', rate: 0.79, preset: 'calm' });
    stage.setVoice('Zira');
    reading(w.frame, stage, { sentence: 'When a calm voice', word: 'reads', anchor: 'Why listening helps' });
  },

  async speed() {
    html(`<div style="position:absolute;left:72px;top:84px;width:560px">
      <h1 class="headline">Seven real speeds.<br><span class="accent">Every notch is one<br>you can hear.</span></h1>
      <p class="sub" style="margin-top:18px">Most readers give you a slider where half the settings sound identical.
      Whisper Reader measures your browser's voice engine and only offers speeds that are really different.</p>
      <div class="ladder" style="margin-top:28px">
        <span>0.5×</span><span>0.6×</span><span>0.8×</span><span>1.0×</span><span class="on">1.3×</span><span>1.6×</span><span>2.0×</span>
      </div>
      <div style="display:grid;gap:20px;margin-top:34px">
        <div class="feature"><div class="icon">${svgIcon('moon')}</div><div><h3>Pacing presets</h3><p>Bedtime, Calm, Focus and Brisk set speed and the pauses between sentences together.</p></div></div>
        <div class="feature"><div class="icon">${svgIcon('ff')}</div><div><h3>Hold F to skim</h3><p>Jumps to 2× while held, back to your pace when you let go.</p></div></div>
      </div></div>`);
    // A close-up of the real panel, cropped from a live page.
    const scale = 1.3;
    const innerW = 1440, innerH = 760;
    const geo = panelFull(innerW, { height: 470, top: 30 });
    const crop = { w: 520, h: 712 };
    const box = html(`<div class="float-panel"></div>`, { left: '700px', top: '44px', width: crop.w + 'px', height: crop.h + 'px', background: '#fbf8f2' });
    const frame = document.createElement('iframe');
    const offX = -(geo.x - (crop.w / scale - geo.width) / 2) * scale;
    const offY = -(geo.y - 12) * scale;
    Object.assign(frame.style, { width: innerW + 'px', height: innerH + 'px', transform: `scale(${scale})`, left: offX + 'px', top: offY + 'px' });
    const loaded = new Promise((r) => frame.addEventListener('load', r, { once: true }));
    frame.src = ARTICLE;
    box.appendChild(frame);
    await loaded;
    const stage = await stageIn(frame, { geometry: geo, theme: 'light', rate: 1.3, preset: 'brisk' });
    stage.setVoice('Zira');
    stage.setRate(1.26);
    reading(frame, stage, { sentence: 'We glance at a headline', word: 'headline', fromTop: 330, remainingMs: 3 * 60_000 });
  },

  async voices() {
    html(`<div class="center" style="top:50px">
      <h1 class="headline">Choose your accent and voice, <span class="accent">by hearing it.</span></h1>
      <p class="sub">A three-question setup on install, with every answer already filled in. Run it again any time.</p></div>`);
    const a = browserWindow({ x: 70, y: 196, w: 560, h: 640, url: 'Whisper Reader · Setup', src: WELCOME, inner: [680], scale: 560 / 680 });
    const b = browserWindow({ x: 600, y: 238, w: 610, h: 600, url: 'Whisper Reader · Setup', src: WELCOME, inner: [680], scale: 610 / 680 });
    await Promise.all([a.loaded, b.loaded]);
    await welcomeAt(a.frame, 1, 'British English');
    await welcomeAt(b.frame, 2);
  },

  async shortcuts() {
    html(`<div style="position:absolute;left:72px;top:56px;right:72px">
      <h1 class="headline">Keyboard shortcuts <span class="accent">for everything.</span></h1>
      <p class="sub">Start, pause and skim without reaching for the mouse.</p></div>`);
    const combo = (...keys) => keys.map((k, i) => (i ? '<span class="plus">+</span>' : '') + `<span class="key${i === keys.length - 1 ? ' amber' : ''}">${k}</span>`).join('');
    html(`<div class="card" style="left:72px;top:200px;width:560px;height:540px">
      <p class="group-title">Anywhere in the browser</p>
      <div class="global-row"><div class="combo">${combo('Alt', 'Shift', 'R')}</div><div class="what">Open Whisper Reader<small>Toolbar menu for this page</small></div></div>
      <div class="global-row"><div class="combo">${combo('Alt', 'Shift', 'P')}</div><div class="what">Play / pause<small>Starts reading the page you're on</small></div></div>
      <div class="global-row"><div class="combo">${combo('Alt', 'Shift', 'S')}</div><div class="what">Read selection<small>Reads just the text you selected</small></div></div>
      <p style="margin:22px 0 0;color:var(--muted);font-size:14.5px;line-height:1.5">On a Mac, Alt is the Option key (⌥). All three can be changed in your browser's extension shortcut settings.</p>
    </div>`);
    const k = (t, cls = '') => `<span class="key small${cls}">${t}</span>`;
    const or = '<span class="or">or</span>';
    html(`<div class="card" style="left:660px;top:200px;width:548px;height:540px">
      <p class="group-title">On the page, while the player is open</p>
      <div style="display:grid;gap:15px">
        <div class="page-key"><div class="keys">${k('Space')}${or}${k('K')}</div><div class="what">Play / pause</div></div>
        <div class="page-key"><div class="keys">${k('←')}${k('→')}${or}${k('J')}${k('L')}</div><div class="what">Previous / next sentence</div></div>
        <div class="page-key"><div class="keys">${k('Shift')}<span class="plus" style="margin:0 3px">+</span>${k('←')}${k('→')}</div><div class="what">Previous / next paragraph</div></div>
        <div class="page-key"><div class="keys"><span style="font-size:13px;color:var(--muted);margin-right:4px">hold</span>${k('F', ' amber')}</div><div class="what">Skim at 2× while held</div></div>
        <div class="page-key"><div class="keys">${k('+')}${k('−')}</div><div class="what">Faster / slower, one real speed per press</div></div>
        <div class="page-key"><div class="keys">${k('Esc')}</div><div class="what">Close the player</div></div>
      </div>
      <div style="border-top:1px solid var(--line);margin-top:18px;padding-top:16px;display:grid;gap:8px;font-size:15px;color:var(--muted)">
        <div><b style="color:var(--ink)">Double-click</b> any word to start reading from there</div>
        <div><b style="color:var(--ink)">Select text</b> and it reads just that passage</div>
        <div><b style="color:var(--ink)">Alt-click</b> a paragraph to start reading from it</div>
        <div><b style="color:var(--ink)">Right-click</b> → Read this page / Read selection aloud</div>
      </div>
    </div>`);
  },

  async themes() {
    html(`<div class="center" style="top:50px">
      <h1 class="headline">Light, dark, <span class="accent">or follow your system.</span></h1>
      <p class="sub">The player matches your OS by default. Highlights read the page underneath, so they stay soft on dark sites too.</p></div>`);
    const inner = 1000, s = 560 / inner;
    const left = browserWindow({ x: 64, y: 222, w: 560, h: 620, url: ARTICLE_URL, src: ARTICLE + '?layout=left', inner: [inner], scale: s });
    const right = browserWindow({ x: 656, y: 222, w: 560, h: 620, url: ARTICLE_URL, dark: true, src: ARTICLE + '?layout=left&dark', inner: [inner], scale: s });
    await Promise.all([left.loaded, right.loaded]);
    const geo = panelFull(inner, { width: 330, height: 460, right: 16, top: 20 });
    const a = await stageIn(left.frame, { geometry: geo, theme: 'light', rate: 0.79, preset: 'calm' });
    const b = await stageIn(right.frame, { geometry: geo, theme: 'dark', rate: 0.79, preset: 'calm' });
    a.setVoice('Zira'); b.setVoice('Zira');
    b.setPageDark(true);
    reading(left.frame, a, { sentence: 'Following the words', word: 'screen', anchor: 'Why listening helps' });
    reading(right.frame, b, { sentence: 'Following the words', word: 'screen', anchor: 'Why listening helps' });
    html(`<div class="label-row" style="left:64px;top:184px"><span class="pill-label">Light</span></div>`);
    html(`<div class="label-row" style="left:656px;top:184px"><span class="pill-label" style="background:#1d1b17;color:#f1ede6">Dark</span></div>`);
  },

  async select() {
    html(`<div class="center" style="top:54px">
      <h1 class="headline">Select a passage. <span class="accent">It reads just that.</span></h1>
      <p class="sub">Or double-click any word to start from there. Works even where a page defeats automatic detection.</p></div>`);
    const s = 1160 / 1440;
    const w = browserWindow({ x: 60, y: 196, w: 1160, h: 650, url: ARTICLE_URL, src: ARTICLE, inner: [1440], scale: s });
    await w.loaded;
    // 700 inner px is what is visible above the canvas edge, not the frame's
    // full height; the player has to sit inside the part people can see.
    const stage = await stageIn(w.frame, { geometry: panelCompact(1440, 700), theme: 'light', rate: 0.79, preset: 'calm' });
    stage.setVoice('Zira');
    const i = sentenceIndex(stage, 'Following the words');
    w.frame.contentWindow.scrollTo(0, Math.max(0, stage.sentenceTop(i) - 190));
    // Selection paints in the inactive grey unless its frame has focus.
    w.frame.contentWindow.focus();
    stage.selectSentences(i, i + 1);
    stage.setState({ status: 'speaking', sentenceIndex: i, remainingMs: 25_000 });
    // Pointer resting where the drag ended.
    const end = stage.wordRect(i + 1, stage.sentences()[i + 1].words.length - 1);
    if (end) {
      const vp = w.win.querySelector('.viewport').getBoundingClientRect();
      html(`<svg class="cursor" viewBox="0 0 26 34"><path d="M3 3 L3 27 L9.5 21 L14 31 L18 29 L13.6 19.4 L22 19.4 Z" fill="#fff" stroke="#1d1b17" stroke-width="2" stroke-linejoin="round"/></svg>`,
        { left: vp.left + (end.right + 2) * s + 'px', top: vp.top + (end.top + end.height * 0.55) * s + 'px' });
    }
  },

  async setup() {
    html(`<div style="position:absolute;left:72px;top:176px;width:430px">
      <h1 class="headline">Set up in<br><span class="accent">three questions.</span></h1>
      <p class="sub" style="margin-top:18px">Accent, voice and listening speed, with a sample to hear at every step. Skip it and the defaults are already good.</p>
      <div style="display:grid;gap:20px;margin-top:34px">
        <div class="feature"><div class="icon">${svgIcon('globe')}</div><div><h3>Every accent you have</h3><p>American, British, Canadian and more, from the voices on your computer.</p></div></div>
        <div class="feature"><div class="icon">${svgIcon('play')}</div><div><h3>Hear before you choose</h3><p>Play a sample of any voice at any speed.</p></div></div>
      </div></div>`);
    const w = browserWindow({ x: 560, y: 170, w: 650, h: 460, url: 'Whisper Reader · Setup', src: WELCOME, inner: [700], scale: 650 / 700 });
    await w.loaded;
    await welcomeAt(w.frame, 3);
  },

  async 'promo-small'() {
    html(`<div style="position:absolute;inset:0;padding:30px 32px;display:flex;flex-direction:column;justify-content:space-between">
      <div style="display:flex;align-items:center;gap:14px">${ICON.replace('<svg', '<svg width="58" height="58"')}
        <div><p class="promo-title">Whisper Reader</p><p style="margin:2px 0 0;color:var(--muted);font-size:16px">Read any page aloud</p></div></div>
      <p class="demo-line" style="margin:0"><span class="s">Eyes and ears agree on a single place in the <span class="w">text</span>.</span></p>
      <p style="margin:0;font-size:13.5px;color:var(--muted);font-weight:500">Free · No account · Nothing leaves your device</p></div>`);
  },

  async 'promo-marquee'() {
    html(`<div style="position:absolute;left:72px;top:0;bottom:0;width:470px;display:flex;flex-direction:column;justify-content:center">
      <div class="brand" style="font-size:20px;gap:12px">${ICON.replace('<svg', '<svg style="width:40px;height:40px"')}Whisper Reader</div>
      <h1 class="headline" style="font-size:50px;margin-top:22px">Listen to any page.<br><span class="accent">Follow every word.</span></h1>
      <p class="sub" style="margin-top:16px">A calm voice, word-by-word highlighting, and real speed control. Free, private, no account.</p></div>`);
    // The whole window, player included, inside the tile: article on the
    // left of its page, player beside it rather than over the text.
    const s = 760 / 1100;
    const w = browserWindow({ x: 600, y: 64, w: 760, h: 540, url: ARTICLE_URL, src: ARTICLE + '?layout=left', inner: [1100], scale: s });
    await w.loaded;
    const stage = await stageIn(w.frame, { geometry: panelFull(1100, { width: 340, height: 450, right: 20, top: 20 }), theme: 'light', rate: 0.79, preset: 'calm' });
    stage.setVoice('Zira');
    reading(w.frame, stage, { sentence: 'When a calm voice', word: 'reads', anchor: 'Why listening helps' });
  },
};

// GitHub's social preview: shown when the repository link is shared.
SLIDES.social = async function () {
  html(`<div style="position:absolute;left:72px;top:0;bottom:0;width:470px;display:flex;flex-direction:column;justify-content:center">
    <div class="brand" style="font-size:20px;gap:12px">${ICON.replace('<svg', '<svg style="width:40px;height:40px"')}Whisper Reader</div>
    <h1 class="headline" style="font-size:50px;margin-top:22px">Listen to any page.<br><span class="accent">Follow every word.</span></h1>
    <p class="sub" style="margin-top:16px">Open-source text-to-speech extension for Chrome and Firefox. Free, private, no account.</p></div>`);
  const s = 700 / 1100;
  const w = browserWindow({ x: 560, y: 70, w: 700, h: 620, url: ARTICLE_URL, src: ARTICLE + '?layout=left', inner: [1100], scale: s });
  await w.loaded;
  const stage = await stageIn(w.frame, { geometry: panelFull(1100, { width: 340, height: 450, right: 20, top: 20 }), theme: 'light', rate: 0.79, preset: 'calm' });
  stage.setVoice('Zira');
  reading(w.frame, stage, { sentence: 'When a calm voice', word: 'reads', anchor: 'Why listening helps' });
};

function svgIcon(name) {
  const paths = {
    moon: '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>',
    ff: '<path d="M4 6l7 6-7 6zM13 6l7 6-7 6z" fill="currentColor"/>',
    globe: '<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18" fill="none" stroke="currentColor" stroke-width="2"/>',
    play: '<path d="M7 5l12 7-12 7z" fill="currentColor"/>',
  };
  return `<svg viewBox="0 0 24 24">${paths[name]}</svg>`;
}

window.__ready = (async () => {
  await document.fonts.ready;
  await SLIDES[slide]();
  await sleep(250);
  return true;
})();
</script>
</body>
</html>
